<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Translator & Text-to-Speech</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet"/>

  <style>
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background-color: #FFF8E7; /* Cream background */
      color: #333;
    }

    header {
      background-color: #FF6F61; /* Coral */
      color: white;
      padding: 3rem 1rem;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2.4rem;
      font-weight: 700;
    }

    header p {
      margin-top: 0.5rem;
      font-size: 1.2rem;
      opacity: 0.9;
    }

    .cta-button {
      background-color: white;
      color: #FF6F61;
      padding: 0.8rem 1.6rem;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
      margin-top: 1.5rem;
      transition: 0.2s;
    }

    .cta-button:hover {
      background-color: #FFE2DC;
    }

    main {
      max-width: 900px;
      margin: 2rem auto;
      padding: 1rem;
    }

    section {
      margin-bottom: 3rem;
    }

    h2 {
      color: #FF6F61;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-top: 1rem;
    }

    .feature-card {
      background-color: white;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .screenshot {
      width: 100%;
      border-radius: 10px;
      margin-top: 1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: #777;
      font-size: 0.9rem;
    }

    a.github-link {
      color: #FF6F61;
      font-weight: bold;
      text-decoration: none;
    }

    a.github-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <!-- HERO SECTION -->
  <header>
    <h1>🌍 Google Gemini Translator & Text‑to‑Speech</h1>
    <p>Translate English text into 60+ languages and hear it spoken aloud — instantly.</p>
